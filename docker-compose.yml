# Production-like stack with PostgreSQL. Local development does not need
# this file — `npm run dev` with the default SQLite DATABASE_URL is enough.
#
# To actually run against Postgres: set `provider = "postgresql"` in
# prisma/schema.prisma (it defaults to "sqlite" for zero-setup local dev —
# see the comment at the top of that file), then:
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: civicflow
      POSTGRES_PASSWORD: civicflow
      POSTGRES_DB: civicflow
    ports:
      - "5432:5432"
    volumes:
      - civicflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://civicflow:civicflow@db:5432/civicflow
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in your environment or .env}
      COOKIE_SECURE: "true"
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports:
      - "3000:3000"

volumes:
  civicflow_db_data:
